<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#faf6f0" />

  <!-- ===================================================================
       LINK-PREVIEW TAGS (WhatsApp / Facebook / iMessage / Twitter)
       These cannot be changed from config.js. After you choose your domain:
         1. Replace every  https://YOUR-DOMAIN.com  below with your real address
            (keep it https:// and no trailing slash).
         2. Edit the title / description text if the names or dates change.
       ==================================================================== -->
  <title>Parvez &amp; Palak — Wedding Invitation · November 2026</title>
  <meta name="description" content="Join Parvez Surani &amp; Palak Mistry for their wedding celebrations from 19th to 21st November 2026." />
  <meta name="author" content="Parvez &amp; Palak" />
  <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
  <meta property="og:title" content="Parvez &amp; Palak — Wedding Invitation" />
  <meta property="og:description" content="Join Parvez Surani &amp; Palak Mistry for their wedding celebrations from 19th to 21st November 2026." />
  <meta property="og:image" content="https://YOUR-DOMAIN.com/assets/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Parvez &amp; Palak — Wedding Invitation" />
  <meta name="twitter:description" content="Join Parvez Surani &amp; Palak Mistry for their wedding celebrations from 19th to 21st November 2026." />
  <meta name="twitter:image" content="https://YOUR-DOMAIN.com/assets/images/og-image.jpg" />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com/" />
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,700&amp;family=DM+Serif+Display:ital@0;1&amp;family=Great+Vibes&amp;family=Cinzel:wght@400;500;600;700;800&amp;family=Mulish:wght@400;500;600;700&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" as="image" href="assets/video/intro-poster.jpg" />
</head>

<body class="locked">

  <!-- Blurred scenery that is visible beside the phone-shaped column on desktop -->
  <div class="stage-bg" aria-hidden="true"></div>

  <div class="frame" id="frame">
    <main id="invite"></main>
    <noscript>
      <p style="padding:40px 24px;text-align:center;font-family:serif">
        Please enable JavaScript to view this wedding invitation.
      </p>
    </noscript>
  </div>

  <!-- Falling petals + music button (aligned to the column) -->
  <div class="fx" id="petals" aria-hidden="true"></div>
  <div class="fx-ui">
    <button type="button" id="music-btn" class="music-btn" hidden aria-label="Mute background music">
      <svg class="ico-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
      <svg class="ico-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
    </button>
  </div>

  <!-- Intro gate: tap → video plays → invitation is revealed -->
  <!-- "Scroll Down" cue — visible on the first screen so guests know to scroll -->
  <div class="fx-cue" aria-hidden="false">
    <button type="button" id="scroll-cue" class="scroll-cue" aria-label="Scroll down">
      <span id="scroll-cue-text">Scroll Down</span>
      <span class="chev" aria-hidden="true">
        <svg width="18" height="10" viewBox="0 0 16 10"><path d="M1 1L8 8L15 1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg width="18" height="10" viewBox="0 0 16 10"><path d="M1 1L8 8L15 1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </div>

  <div class="intro-wrap" id="intro-wrap">
    <div class="intro" id="intro" role="button" tabindex="0" aria-label="Tap to open the invitation">
      <video id="intro-video" src="assets/video/intro.mp4" poster="assets/video/intro-poster.jpg"
             playsinline webkit-playsinline muted preload="auto"></video>
      <div class="intro-cta" id="intro-cta">
        <div class="cta-glow"></div>
        <div class="cta-pill">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
          <span id="intro-text">Tap to Open</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9L12 2zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <audio id="bgm" loop preload="none"></audio>

  <script src="js/defaults.js"></script>
  <script src="js/fonts.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
